# Publishes the package to npm with a provenance statement when a version tag
# (for example 0.1.7) is pushed. n8n requires this for verified community nodes
# since May 1, 2026: https://docs.n8n.io/connect/create-nodes/deploy-your-node/submit-community-nodes
#
# One-time setup on npmjs.com (package settings → Trusted Publishers → GitHub Actions):
#   Repository owner: screenshotone
#   Repository name:  n8n-nodes-screenshotone
#   Workflow name:    publish.yml
# Or store a granular npm access token as the NPM_TOKEN repository secret.
#
# Release: bump the version in package.json, commit, then
#   git tag 0.1.7 && git push origin master 0.1.7

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Check that the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Release
        # n8n-node release runs lint, build and npm publish with provenance in CI.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
